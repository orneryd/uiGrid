[workspace]
members = [
  "crates/ui-grid-c-abi",
  "crates/ui-grid-contracts",
  "crates/ui-grid-core",
  "crates/ui-grid-egui",
  "crates/ui-grid-fixtures",
  "crates/ui-grid-virtualization",
  "crates/ui-grid-wasm"
]
resolver = "2"

[workspace.package]
version = "1.0.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/ornerydev/ui-grid"
rust-version = "1.95"
authors = ["Ornery UI Grid Contributors"]

[workspace.dependencies]
anyhow = "1.0.103"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.103"
regex = "1.12.4"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.18"
wasm-bindgen = "0.2.126"
wasm-bindgen-test = "0.3.76"
egui = "0.35"
egui_extras = "0.35"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11"] }
jiff = "0.2.31"
