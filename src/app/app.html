<ng-template #statusTemplate let-value>
  <span
    class="status-pill"
    [class.status-pill-enterprise]="value === 'Enterprise'"
    [class.status-pill-active]="value === 'Active'"
    [class.status-pill-expansion]="value === 'Expansion'"
    [class.status-pill-pilot]="value === 'Pilot'">
    {{ value }}
  </span>
</ng-template>

<main class="app-shell">
  <app-ui-grid [options]="options()" />
</main>
