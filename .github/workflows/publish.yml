name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to publish
        required: true
        default: main
      version:
        description: Public version to publish
        required: true
        default: 0.1.0

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: npm ci

      - name: Build the full preset library
        run: npm run build:library:preset -- --preset=full

      - name: Build the web component bundle
        run: npm run build:element

      - name: Prepare the publishable npm package
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          node scripts/prepare-release-package.mjs --version "$VERSION" --presets full

      - name: Publish to npm
        run: npm publish ./dist/npm-package --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}