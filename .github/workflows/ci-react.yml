name: CI React

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci-react.yml'
      - 'projects/ui-grid-react/**'
      - 'projects/ui-grid/src/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the React test suite
        run: npm run test:react

      - name: Build the React package
        run: npm run build --prefix projects/ui-grid-react
