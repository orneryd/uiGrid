name: Publish React package

on:
  push:
    tags:
      - "react-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to publish
        required: true
        default: main
      version:
        description: Public version to publish
        required: true
        default: 0.1.0

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the React package
        run: npm run build --prefix projects/ui-grid-react

      - name: Set the package version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#react-v}"
          fi

          cd projects/ui-grid-react
          npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: npm publish ./projects/ui-grid-react --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
