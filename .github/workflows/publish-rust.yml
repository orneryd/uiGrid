name: Publish Rust crates

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to publish
        required: true
        default: main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}

      # Tier 1 — leaf crates (no internal dependencies)
      - name: Publish ui-grid-contracts
        run: cargo publish -p ui-grid-contracts --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - name: Publish ui-grid-virtualization
        run: cargo publish -p ui-grid-virtualization --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      # Tier 2 — depends on ui-grid-contracts
      - name: Publish ui-grid-core
        run: cargo publish -p ui-grid-core --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      # Tier 3 — depends on ui-grid-core (+ ui-grid-virtualization)
      - name: Publish ui-grid-wasm
        run: cargo publish -p ui-grid-wasm --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - name: Publish ui-grid-egui
        run: cargo publish -p ui-grid-egui --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
